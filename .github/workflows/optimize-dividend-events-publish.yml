name: Optimize dividend event publishing

on:
  push:
    paths:
      - ".github/workflows/optimize-dividend-events-publish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve dividend events across snapshot rebuilds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pipeline/build_snapshot.py")
          text = path.read_text()
          needle = '    snapshot["fundPortfolios"] = load_fund_portfolios(args.fund_portfolios_directory)\n'
          insert = '    snapshot["dividendEvents"] = existing.get("dividendEvents", [])\n' + needle
          marker = 'snapshot["dividendEvents"] = existing.get("dividendEvents", [])'
          if marker not in text:
              if needle not in text:
                  raise SystemExit("build_snapshot insertion point not found")
              path.write_text(text.replace(needle, insert, 1))
          PY
      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests
      - name: Commit optimization
        run: |
          if git diff --quiet -- pipeline/build_snapshot.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/build_snapshot.py
          git commit -m "feat: preserve dividend events on snapshot rebuild"
          git pull --rebase origin main
          git push
