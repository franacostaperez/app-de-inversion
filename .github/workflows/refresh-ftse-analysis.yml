name: Refresh FTSE 100 analysis

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-ftse-analysis.yml"

permissions:
  contents: write

concurrency:
  group: dividend-data-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests
      - name: Build FTSE 100 annual financial histories
        run: >-
          python pipeline/yahoo_company_reports.py
          --company-database data/companies/index.json
          --output data/company-reports/ftse100/yahoo-annual.json
          --failures-output data/public/ftse-report-audit.json
      - name: Rebuild snapshot
        run: >-
          python pipeline/build_snapshot.py
          --current data/source/latest.json
          --previous data/source/previous.json
          --companies data/source/companies.json
          --company-database data/companies/index.json
          --qualitative-database data/companies/qualitative.json
          --valuation-database data/config/company_valuation.json
          --filings-directory data/filings
          --company-reports-directory data/company-reports
          --output data/public/snapshot.json
      - name: Audit rebuilt data
        run: |
          python pipeline/audit_scoring.py --snapshot data/public/snapshot.json --output data/public/scoring-audit.json
          python pipeline/audit_metric_values.py --snapshot data/public/snapshot.json --output data/public/metric-audit.json
      - name: Commit generated FTSE analysis
        run: |
          if git diff --quiet -- data/company-reports/ftse100 data/public/snapshot.json data/public/snapshot-core.json data/public/company-reports data/public/scoring-audit.json data/public/metric-audit.json data/public/ftse-report-audit.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company-reports/ftse100 data/public/snapshot.json data/public/snapshot-core.json data/public/company-reports data/public/scoring-audit.json data/public/metric-audit.json data/public/ftse-report-audit.json
          git commit -m "data: complete FTSE 100 analysis"
          git pull --rebase origin main
          git push
