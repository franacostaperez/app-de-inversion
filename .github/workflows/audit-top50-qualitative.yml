name: Audit Top 50 qualitative review candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-top50-qualitative.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Top 50 qualitative audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          snapshot = json.loads(Path('data/public/snapshot-core.json').read_text())
          consensus = [x for x in snapshot.get('consensus', []) if isinstance(x.get('opportunityRank'), int)]
          top50 = sorted(consensus, key=lambda x: x['opportunityRank'])[:50]
          profiles = snapshot.get('companyProfiles', [])
          by_cusip = {p.get('cusip'): p for p in profiles if p.get('cusip')}
          by_ticker = {p.get('ticker'): p for p in profiles if p.get('ticker')}
          reports = snapshot.get('companyReports', [])

          key_fields = ['description', 'businessModel', 'revenueModel', 'economicMoat', 'brandStrength']
          rows = []
          for item in top50:
              profile = by_cusip.get(item.get('cusip')) or by_ticker.get(item.get('ticker')) or {}
              related = [r for r in reports if (item.get('cusip') and r.get('cusip') == item.get('cusip')) or (item.get('ticker') and r.get('ticker') == item.get('ticker'))]
              related.sort(key=lambda r: (r.get('filingDate') or '', r.get('reportDate') or ''), reverse=True)
              latest = related[0] if related else None
              missing_profile_fields = [f for f in key_fields if not profile.get(f)]
              new_material_source = bool(latest and str(latest.get('filingDate', ''))[:10] >= '2026-09-10')
              if not profile or missing_profile_fields:
                  status = 'PENDING_REVIEW'
                  reason = 'Missing qualitative profile or key qualitative fields'
              elif new_material_source:
                  status = 'REVIEW_ON_CHANGE'
                  reason = f"New {latest.get('form','filing')} filed {str(latest.get('filingDate',''))[:10]}"
              else:
                  status = 'NO_CHANGE_TRIGGER'
                  reason = 'No new material source detected; preserve existing analysis'
              rows.append({
                  'rank': item.get('opportunityRank'),
                  'ticker': item.get('ticker'),
                  'company': item.get('company'),
                  'cusip': item.get('cusip'),
                  'score': item.get('opportunityScore'),
                  'scoreCoverage': item.get('scoreCoverage'),
                  'status': status,
                  'reason': reason,
                  'missingProfileFields': missing_profile_fields,
                  'latestReport': ({k: latest.get(k) for k in ['form','filingDate','reportDate','secURL']} if latest else None),
              })

          output = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'policy': 'AI only on change: pending only when profile is incomplete; review only when a new material filing exists. No age-only expiry because the repository has no prior-evaluation expiry metadata.',
              'counts': {
                  'top50': len(rows),
                  'pending': sum(r['status'] == 'PENDING_REVIEW' for r in rows),
                  'reviewOnChange': sum(r['status'] == 'REVIEW_ON_CHANGE' for r in rows),
                  'noChangeTrigger': sum(r['status'] == 'NO_CHANGE_TRIGGER' for r in rows),
              },
              'candidates': [r for r in rows if r['status'] != 'NO_CHANGE_TRIGGER'],
              'top50': rows,
          }
          Path('top50-qualitative-audit.json').write_text(json.dumps(output, indent=2) + '\n')
          print(json.dumps(output['counts']))
          for row in output['candidates']:
              print(row['rank'], row['ticker'], row['status'], row['reason'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: top50-qualitative-audit
          path: top50-qualitative-audit.json
          retention-days: 7
