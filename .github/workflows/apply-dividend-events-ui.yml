name: Apply dividend events UI integration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-dividend-events-ui.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply source integration
        run: python pipeline/integrate_dividend_events_ui.py
      - name: Commit Swift changes
        run: |
          if git diff --quiet -- App/RootView.swift Sources/DividendIntelligenceKit/Models.swift; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/RootView.swift Sources/DividendIntelligenceKit/Models.swift
          git commit -m "feat: add dividend events calendar UI"
          git push
