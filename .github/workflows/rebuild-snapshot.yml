name: Rebuild app snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pipeline/build_snapshot.py"
      - "pipeline/refresh_snapshot.py"
      - "pipeline/run_automation.py"
      - "data/source/**"
      - "data/companies/**"
      - "data/filings/**"
      - "data/company-reports/**"
      - "data/instruments/**"
      - "data/fund-portfolios/**"
      - "data/config/company_valuation.json"
      - ".github/workflows/rebuild-snapshot.yml"

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      mode: "rebuild"
    secrets: inherit
