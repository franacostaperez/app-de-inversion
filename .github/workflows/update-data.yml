name: Refresh weekly fundamentals and audits

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 6"
  push:
    branches: [main]
    paths:
      - "data/config/portfolio.json"
      - "pipeline/enrich_companies.py"
      - "pipeline/enrich_companies_safe.py"
      - "pipeline/run_automation.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      mode: "weekly"
    secrets: inherit
