name: Update dividend data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests
      - name: Build snapshot
        run: >-
          python pipeline/build_snapshot.py
          --current data/source/2026-Q1.json
          --previous data/source/2025-Q4.json
          --companies data/source/companies.json
          --output data/public/snapshot.json
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/public/snapshot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/snapshot.json
          git commit -m "data: update dividend snapshot"
          git push

