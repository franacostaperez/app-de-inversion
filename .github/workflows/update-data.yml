name: Update dividend data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "data/config/investors.json"
      - "pipeline/**"
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: dividend-data-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: python -m unittest discover -s pipeline/tests
      - name: Download latest 13F filings from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python pipeline/sec_edgar.py
          --investors data/config/investors.json
          --companies data/source/companies.json
          --current-output data/source/latest.json
          --previous-output data/source/previous.json
          --filings-output data/filings
      - name: Enrich newly reported companies
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python pipeline/enrich_companies.py
          --holdings data/source/latest.json
          --database data/companies/index.json
          --max-new 1000
      - name: Complete qualitative company profiles
        run: >-
          python pipeline/enrich_qualitative.py
          --holdings data/source/latest.json
          --company-database data/companies/index.json
          --qualitative-database data/companies/qualitative.json
      - name: Monitor company annual reports and dividends
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          python pipeline/sec_company_reports.py
          --company-database data/companies/index.json
          --qualitative-database data/companies/qualitative.json
          --output data/company-reports
      - name: Detect new filings or company data
        id: changes
        run: |
          if git diff --quiet -- data/source/latest.json data/source/previous.json data/companies/index.json data/filings data/company-reports; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build snapshot
        run: >-
          python pipeline/build_snapshot.py
          --current data/source/latest.json
          --previous data/source/previous.json
          --companies data/source/companies.json
          --company-database data/companies/index.json
          --qualitative-database data/companies/qualitative.json
          --valuation-database data/config/company_valuation.json
          --filings-directory data/filings
          --company-reports-directory data/company-reports
          --output data/public/snapshot.json
      - name: Audit scoring data coverage
        run: >-
          python pipeline/audit_scoring.py
          --snapshot data/public/snapshot.json
          --output data/public/scoring-audit.json
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/source/latest.json data/source/previous.json data/companies/index.json data/companies/qualitative.json data/filings data/company-reports data/public/snapshot.json data/public/scoring-audit.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/latest.json data/source/previous.json data/companies/index.json data/companies/qualitative.json data/filings data/company-reports data/public/snapshot.json data/public/scoring-audit.json
          git commit -m "data: update dividend snapshot"
          git push
