name: Refresh 13F portfolios

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2,5"
  push:
    branches: [main]
    paths:
      - "data/config/investors.json"

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      mode: "13f"
    secrets: inherit
