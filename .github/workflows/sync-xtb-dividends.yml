name: Sync XTB dividend history

on:
  workflow_dispatch:
  push:
    paths:
      - "data/.xtb-sync-trigger"
  schedule:
    # After the daily Gmail -> Google Sheet import. UTC avoids DST-specific cron maintenance.
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: xtb-dividends-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google Sheets client dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Sync XTB cash receipts
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          XTB_DIVIDENDS_SHEET_ID: ${{ vars.XTB_DIVIDENDS_SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is not configured; keeping the last published XTB snapshot."
            exit 0
          fi
          python pipeline/sync_xtb_dividends.py
      - name: Validate generated XTB data
        run: python -m unittest discover -s pipeline/tests
      - name: Commit only when the Sheet changed
        run: |
          git add data/public/xtb-dividends.json data/public/snapshot.json
          if git diff --cached --quiet; then
            echo "No dividend changes; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sync XTB dividend cash history"
          git push
