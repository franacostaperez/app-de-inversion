name: Refresh dividend calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 6"
  push:
    branches: [main]
    paths:
      - "data/config/dividend_ir_sources.json"

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/data-pipeline.yml
    with:
      mode: "dividends"
    secrets: inherit
