name: Apply Macy's qualitative review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-macys-qualitative-review.yml"

permissions:
  contents: write

concurrency:
  group: dividend-data-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply evidence-backed Macy's review
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/companies/qualitative.json')
          rows = json.loads(path.read_text())
          target = next((r for r in rows if r.get('cusip') == '55616P104'), None)
          if target is None:
              raise SystemExit("Macy's qualitative profile not found")

          target.update({
              'ticker': 'M',
              'name': "MACYS INC",
              'source': "Macy's Investor Relations Q2 2026 · SEC EDGAR 10-Q filed 2026-09-10",
              'status': 'qualitative',
              'updatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'description': "Macy's, Inc. es un grupo de retail omnicanal estadounidense que opera las enseñas Macy's, Bloomingdale's y Bluemercury. Combina una red nacional de tiendas con comercio digital y está concentrando inversión en las ubicaciones y formatos con mejores retornos dentro de su estrategia Bold New Chapter.",
              'businessModel': "Opera una cartera de grandes almacenes y retail especializado apoyada por canales digitales, surtido de marcas propias y de terceros, programas de fidelización y servicios asociados. La estrategia actual prioriza las tiendas Reimagine 200 y el crecimiento de Bloomingdale's y Bluemercury, a la vez que racionaliza establecimientos de menor productividad.",
              'revenueModel': "La mayor parte de los ingresos procede de la venta de mercancía en tiendas y canales digitales. Se complementa con ingresos de tarjetas de crédito y Macy's Media Network, que monetiza la relación con clientes y proveedores. En Q2 2026 las ventas netas crecieron 1,1%, las ventas comparables 2,7%, Bloomingdale's 11,3% y Bluemercury 6,2%, y la compañía elevó su guidance anual.",
              'economicMoat': "Foso moderado, no estructuralmente alto. Sus activos defensivos son el reconocimiento de Macy's y Bloomingdale's, relaciones con marcas, escala de compra, ubicaciones, base de clientes y datos de fidelización. Esos activos aportan diferenciación, pero los costes de cambio del cliente son bajos y el retail discrecional afronta competencia intensa, sensibilidad al ciclo y presión de formatos digitales y especializados. La mejora reciente reduce el riesgo operativo, pero todavía exige confirmar que el crecimiento comparable y la recuperación de márgenes son sostenibles.",
              'brandStrength': 'medium',
              'investorRelationsURL': 'https://www.macysinc.com/investors',
              'investorRelationsVerified': True,
          })
          path.write_text(json.dumps(rows, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Rebuild snapshot and audits
        run: |
          python pipeline/run_automation.py rebuild
      - name: Commit reviewed data
        run: |
          git add data/companies/qualitative.json data/public/snapshot.json data/public/snapshot-core.json data/public/scoring-audit.json data/public/metric-audit.json data/automation/state.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh Macy's qualitative analysis"
          git push
