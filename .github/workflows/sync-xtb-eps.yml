name: Sync quarterly EPS for XTB dividend payers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-xtb-eps.yml"
      - "pipeline/sync_xtb_eps.py"
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

concurrency:
  group: dividend-data-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check EPS comparison logic
        run: python -m unittest pipeline.tests.test_xtb_eps
      - name: Refresh observed quarterly EPS
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          XTB_EPS_AV_BUDGET: "12"
        run: python pipeline/sync_xtb_eps.py
      - name: Commit refreshed data
        run: |
          git add data/public/xtb-eps.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh XTB payer earnings history"
          git push
