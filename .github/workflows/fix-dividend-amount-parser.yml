name: Harden dividend per-share parsing (manual repair)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dividend-data-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply the pending per-share parser repair
        run: python pipeline/maintenance/harden_dividend_parser.py
      - name: Test pipeline including parser regression
        run: python -m unittest discover -s pipeline/tests
      - name: Commit verified parser repair
        run: |
          git add pipeline/dividend_events.py pipeline/tests/test_dividend_events.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: require per-share dividend amounts"
          git push
