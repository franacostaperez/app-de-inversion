name: Refresh all Dividend Intelligence data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-all-now.yml"

permissions:
  contents: write

concurrency:
  group: dividend-full-refresh-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sync dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests
      - name: Sync XTB dividend history
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          XTB_DIVIDENDS_SHEET_ID: ${{ vars.XTB_DIVIDENDS_SHEET_ID }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python pipeline/sync_xtb_dividends.py
          else
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is not configured; retaining current XTB data."
          fi
      - name: Refresh prices, SEC reports, 13F, fundamentals and dividend calendar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          set -e
          python pipeline/run_automation.py prices
          python pipeline/run_automation.py sec
          python pipeline/run_automation.py 13f
          python pipeline/run_automation.py weekly
          python pipeline/run_automation.py dividends
          python pipeline/run_automation.py rebuild
      - name: Preserve personal XTB dividend history in final snapshot
        run: python pipeline/preserve_personal_dividends.py
      - name: Validate generated data
        run: python -m unittest discover -s pipeline/tests
      - name: Commit refreshed data once
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "All sources checked; no data changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: full refresh"
          git push
      - name: Refresh summary
        if: always()
        run: |
          echo '### Dividend Intelligence full refresh' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/automation/state.json ]; then
            cat data/automation/state.json >> "$GITHUB_STEP_SUMMARY"
          fi
