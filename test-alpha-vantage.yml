name: Test Alpha Vantage dividends

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dividends:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Alpha Vantage
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python pipeline/alpha_vantage_dividends.py KO O VICI MRK
